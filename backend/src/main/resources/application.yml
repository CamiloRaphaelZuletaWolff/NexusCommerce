spring:
  application:
    name: nexuscommerce-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # SPRING_DATASOURCE_URL wins if set; otherwise compose from discrete host/port/db
    # (managed Postgres on Render exposes these as separate Blueprint properties).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexuscommerce}}
    username: ${SPRING_DATASOURCE_USERNAME:nexus}
    password: ${SPRING_DATASOURCE_PASSWORD:nexus_local_pw}
    hikari:
      # Native SQL (CALL sp_reserve_inventory, v_store_revenue, fn_store_sales_summary)
      # is schema-unqualified. Locally the role's search_path is set by infra/db init;
      # managed Postgres (Neon) has no such setup, so pin it per connection.
      connection-init-sql: SET search_path TO commerce, public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: commerce
        format_sql: false

  flyway:
    enabled: true
    schemas: commerce
    default-schema: commerce
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://nexus_app:mongo_app_local_pw@localhost:27017/nexuscatalog}
      auto-index-creation: true
    web:
      pageable:
        # Default cap is 2000 rows per page; nothing in the UI needs more than 100.
        max-page-size: 100

server:
  # Render injects PORT; fall back to SERVER_PORT, then 8080 for local/dev.
  port: ${PORT:${SERVER_PORT:8080}}
  # Deployed behind TLS-terminating proxies (Render, and Vercel's /api rewrite):
  # honour X-Forwarded-Proto/Host/For so generated URLs (e.g. the Swagger "servers"
  # entry) use https and request.getRemoteAddr() is the real client IP.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Application-specific configuration (bound to typed @ConfigurationProperties)
app:
  jwt:
    # Base64-encoded HMAC secret (>= 256 bits). Provided per-environment via env var.
    # A dev-only default is set in application-dev.yml.
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    issuer: nexuscommerce
  auth:
    refresh:
      ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    cookie:
      name: ${AUTH_COOKIE_NAME:nexus_refresh}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAMESITE:Lax}
      path: /api/auth
      domain: ${AUTH_COOKIE_DOMAIN:}
    # In-memory brute-force limits for /api/auth/login and /api/auth/register
    # (AuthRateLimiter; one instance, resets on restart). Exceeding them returns 429.
    rate-limit:
      login-attempts-per-ip: ${AUTH_RATE_LIMIT_LOGIN_PER_IP:20}
      login-failures-per-email: ${AUTH_RATE_LIMIT_FAILURES_PER_EMAIL:5}
      registrations-per-ip: ${AUTH_RATE_LIMIT_REGISTER_PER_IP:10}
      window: ${AUTH_RATE_LIMIT_WINDOW:15m}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  encryption:
    # Base64-encoded AES key (128/192/256-bit) for column-level encryption of
    # sensitive payment fields. Provided per-environment; dev default in application-dev.yml.
    key: ${APP_ENCRYPTION_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
