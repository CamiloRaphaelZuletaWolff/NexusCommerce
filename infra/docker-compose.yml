# NexusCommerce — local development infrastructure
#
# Usage:
#   Databases only (default):   docker compose up -d
#   Databases + admin UIs:      docker compose --profile tools up -d
#   Tear down (keep data):      docker compose down
#   Tear down (wipe data):      docker compose down -v
#
# All credentials come from ./.env (copy from ./.env.example first).

name: nexuscommerce

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL — transactional / relational store
  # (users, roles, stores, orders, payments, invoices, audit_logs, ...)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Bootstrap SQL runs once, only when the data volume is empty.
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [nexus-net]

  # ----------------------------------------------------------------------------
  # MongoDB — flexible product catalog
  # (products, categories, category attributes, tags, variants, brands, ...)
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: nexus-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      # Consumed by the init script to create a least-privilege app user.
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      # Bootstrap JS runs once, only when the data volume is empty.
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [nexus-net]

  # ----------------------------------------------------------------------------
  # pgAdmin — optional Postgres web UI (profile: tools)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: nexus-pgadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nexus-net]

  # ----------------------------------------------------------------------------
  # mongo-express — optional MongoDB web UI (profile: tools)
  # ----------------------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    container_name: nexus-mongo-express
    restart: unless-stopped
    profiles: [tools]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [nexus-net]

volumes:
  postgres_data:
    name: nexus_postgres_data
  mongo_data:
    name: nexus_mongo_data

networks:
  nexus-net:
    name: nexus-net
    driver: bridge
