# Full-stack overlay — adds the backend service on top of the database infra.
#
# Usage (from infra/):
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# The backend reaches the databases by service name over the shared nexus-net.

name: nexuscommerce

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: nexuscommerce-backend:latest
    container_name: nexus-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [nexus-net]
